[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbot"
version = "0.1.0"
description = "Readable, plugin-based local trading platform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tbot = "tbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
