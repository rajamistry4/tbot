[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbot"
version = "0.2.0"
description = "Readable, plugin-based local trading platform"
requires-python = ">=3.11"
dependencies = ["pyarrow>=18,<24"]

[project.scripts]
tbot = "tbot.cli:main"
tbot-data = "tbot.data.commands:main"

[tool.setuptools.packages.find]
where = ["src"]
